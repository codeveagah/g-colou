<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G-Colou</title>
    <style>
      /* Estilo Ajustes do iPhone: listas agrupadas, chave verde do iOS, marsala só de destaque */
      :root {
        --tint: #8e2f3f; --green: #34c759;
        --bg: #f2f2f7; --cell: #ffffff; --sep: rgba(60, 60, 67, 0.18); --text: #000; --muted: rgba(60, 60, 67, 0.62);
        --seg: rgba(118, 118, 128, 0.12); --segOn: #fff; --off: rgba(120, 120, 128, 0.16);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root { --tint: #e0798a; --bg: #000; --cell: #1c1c1e; --sep: rgba(84, 84, 88, 0.6); --text: #fff; --muted: rgba(235, 235, 245, 0.6);
          --seg: rgba(118, 118, 128, 0.24); --segOn: #636366; --off: rgba(120, 120, 128, 0.32); color-scheme: dark; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 360px; background: var(--bg); color: var(--text);
        font: 400 15px/1.35 -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .wrap { max-width: 440px; margin: 0 auto; padding: 14px 16px 18px; }

      header { display: flex; align-items: center; gap: 12px; padding: 4px 4px 14px; }
      .logo { width: 46px; height: 46px; border-radius: 12px; box-shadow: 0 4px 12px rgba(80, 15, 28, 0.3); }
      h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin: 0; line-height: 1.1; }
      .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
      .badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap;
        color: #1f8a3e; background: rgba(52, 199, 89, 0.15); }
      @media (prefers-color-scheme: dark) { .badge { color: #4cd964; } }

      /* prévia: o mesmo vidro do card, sobre um "papel de parede" marsala */
      .stage { position: relative; height: 128px; border-radius: 22px; overflow: hidden; margin-bottom: 22px; display: flex; align-items: center; padding: 0 16px;
        background: radial-gradient(circle at 18% 30%, #ff9a7a 0 46px, transparent 47px), radial-gradient(circle at 80% 78%, #ffd36b 0 38px, transparent 39px),
          radial-gradient(circle at 62% 12%, #c94b63 0 60px, transparent 61px), linear-gradient(135deg, #5a1726, #2a0a12); }
      .stage.right { justify-content: flex-end; }
      .stage.off .card { opacity: 0.4; filter: grayscale(1); }
      .card { position: relative; isolation: isolate; display: flex; align-items: center; gap: 10px; width: 236px; padding: 10px 14px 10px 10px; border-radius: 30px; color: #fff;
        text-shadow: 0 1px 2px rgba(40, 6, 14, 0.35); box-shadow: 0 14px 30px rgba(20, 2, 6, 0.4); transition: filter 0.2s, opacity 0.2s; }
      .card::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
        background: linear-gradient(135deg, rgba(150, 52, 68, 0.5), rgba(92, 22, 36, 0.58)); backdrop-filter: blur(16px) saturate(190%); -webkit-backdrop-filter: blur(16px) saturate(190%);
        box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.2); }
      .card .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, 0.18); }
      .card .hi { font-size: 11.5px; font-weight: 700; opacity: 0.88; }
      .card .code { font: 800 21px/1.1 "Cascadia Mono", ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: 2.5px; }
      .card .from { font-size: 12px; font-weight: 700; opacity: 0.92; }

      .gt { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.2px; margin: 0 16px 7px; }
      .note { font-size: 13px; color: var(--muted); margin: 7px 16px 0; }
      .group { background: var(--cell); border-radius: 14px; overflow: hidden; margin-bottom: 26px; }
      .group.tight { margin-bottom: 0; }
      .row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; }
      .row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
      .row .txt { flex: 1; min-width: 0; }
      .row small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
      label.row { cursor: pointer; }

      /* chave do iOS */
      .sw { position: relative; width: 51px; height: 31px; flex: none; }
      .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
      .sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--off); transition: background 0.25s; pointer-events: none; }
      .sw span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 3px 1px rgba(0, 0, 0, 0.06); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .sw input:checked + span { background: var(--green); }
      .sw input:checked + span::after { transform: translateX(20px); }
      .sw input:focus-visible + span { outline: 2px solid var(--tint); outline-offset: 2px; }

      /* controle segmentado do iOS */
      .seg { display: flex; background: var(--seg); border-radius: 9px; padding: 2px; flex: none; }
      .seg label { position: relative; }
      .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
      .seg span { display: block; padding: 5px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; pointer-events: none; }
      .seg input:checked + span { background: var(--segOn); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04); }
      .seg input:focus-visible + span { outline: 2px solid var(--tint); }

      input[type="text"] { flex: 1; min-width: 0; font: inherit; color: var(--text); background: none; border: 0; text-align: right; padding: 4px 0; }
      input[type="text"]::placeholder { color: var(--muted); }
      input[type="text"]:focus { outline: none; }
      .row:has(input[type="text"]:focus) { box-shadow: inset 3px 0 0 var(--tint); }

      .link { flex: none; font: inherit; font-weight: 600; color: var(--tint); background: none; border: 0; padding: 4px 0; cursor: pointer; }
      .link:focus-visible { outline: 2px solid var(--tint); border-radius: 6px; }

      #saved { text-align: center; font-size: 13px; font-weight: 600; color: var(--green); min-height: 1.3em; margin: 8px 0 0; }
      footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 6px; }
      footer a { color: var(--tint); font-weight: 700; text-decoration: none; }
      footer a:hover { text-decoration: underline; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <img class="logo" src="../icons/icon128.png" alt="" />
        <div>
          <h1 data-i18n="extName"></h1>
          <p class="sub" data-i18n="optSub"></p>
        </div>
        <span class="badge" data-i18n-title="optLocalTip">🔒 <span data-i18n="optLocal"></span></span>
      </header>

      <div class="stage right" id="stage" role="img" data-i18n-label="optPreview">
        <div class="card">
          <div class="ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
          </div>
          <div>
            <div class="hi" id="pvHi"></div>
            <div class="code">482913</div>
            <div class="from" id="pvFrom"></div>
          </div>
        </div>
      </div>

      <div class="group">
        <label class="row">
          <span class="txt"><span data-i18n="optEnabled"></span><small data-i18n="optEnabledSub"></small></span>
          <span class="sw"><input type="checkbox" id="enabled" /><span></span></span>
        </label>
      </div>

      <div class="gt" data-i18n="optYou"></div>
      <div class="group">
        <label class="row" for="name">
          <span data-i18n="optName"></span>
          <input type="text" id="name" maxlength="24" autocomplete="given-name" data-i18n-ph="optNamePh" />
        </label>
      </div>

      <div class="gt" data-i18n="optBehavior"></div>
      <div class="group tight">
        <label class="row">
          <span class="txt"><span data-i18n="optAuto"></span><small data-i18n="optAutoSub"></small></span>
          <span class="sw"><input type="checkbox" id="autoCopy" /><span></span></span>
        </label>
        <label class="row">
          <span class="txt"><span data-i18n="optAll"></span><small data-i18n="optAllSub"></small></span>
          <span class="sw"><input type="checkbox" id="allAccounts" /><span></span></span>
        </label>
        <div class="row">
          <span class="txt"><span data-i18n="optPlace"></span><small id="placeHint" data-i18n="optPlaceSub"></small></span>
          <button type="button" class="link" id="place" data-i18n="optPlaceBtn"></button>
        </div>
        <div class="row" role="radiogroup" aria-labelledby="sideLbl">
          <span class="txt" id="sideLbl" data-i18n="optSide"></span>
          <div class="seg">
            <label><input type="radio" name="side" value="left" /><span data-i18n="optLeft"></span></label>
            <label><input type="radio" name="side" value="right" /><span data-i18n="optRight"></span></label>
          </div>
        </div>
      </div>
      <p class="note" data-i18n="optSideSub"></p>

      <div id="saved" role="status" aria-live="polite"></div>
      <footer>
        <div data-i18n="optFooter"></div>
        <div style="margin-top: 6px"><span data-i18n="optCredit"></span> <a href="https://vitormacedobr.vercel.app" target="_blank" rel="noopener noreferrer">Vitor Macedo</a></div>
      </footer>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
